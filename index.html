<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KRH proposal pack generation flow</title>
<meta name="description" content="Interactive architecture of the KRH proposal pack generation flow: Salesforce, MuleSoft and the Claude API.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%AD%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4FFF7;
  --surface: #FFFFFF;
  --node: #F4FFF7;
  --node-hover: #EAFBEF;
  --ink: #111111;
  --muted: #58595B;
  --soft: #8A8B8D;
  --line: rgba(17, 17, 17, 0.10);
  --wire: #9A9B9D;
  --green: #17B14A;
  --green-text: #0E8A3A;
  --sky: #6BC8F4;
  --spring: #5DE283;
  --sf: #1F86BF;
  --sf-badge: #6BC8F4;
  --sf-badge-ink: #111111;
  --mule: #0E8A3A;
  --mule-badge: #17B14A;
  --mule-badge-ink: #FFFFFF;
  --claude: #111111;
  --cache: #17B14A;
  --hero-ink: #111111;
  --grad: linear-gradient(180deg, #6BC8F4 0%, #5DE283 100%);
  --grad-diag: linear-gradient(135deg, #6BC8F4 0%, #5DE283 100%);
  --shadow-card: 0 4px 9px rgba(0,0,0,.10), 0 16px 16px rgba(0,0,0,.09), 0 36px 22px rgba(0,0,0,.05), 0 64px 26px rgba(0,0,0,.01), 0 100px 28px rgba(0,0,0,0);
  --shadow-card-lg: 0 6px 14px rgba(0,0,0,.10), 0 25px 25px rgba(0,0,0,.09), 0 56px 34px rgba(0,0,0,.05), 0 100px 40px rgba(0,0,0,.01), 0 156px 44px rgba(0,0,0,0);
  --shadow-soft: 0 2px 6px rgba(0,0,0,.10);
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1712;
    --surface: #15221A;
    --node: #1B2B21;
    --node-hover: #213428;
    --ink: #ECF6EF;
    --muted: #A9B7AE;
    --soft: #7F8D84;
    --line: rgba(255, 255, 255, 0.10);
    --wire: #6E7C73;
    --green-text: #4BD27A;
    --sf: #7FD0F6;
    --mule: #4BD27A;
    --claude: #ECF6EF;
    --cache: #4BD27A;
    --shadow-card: 0 4px 10px rgba(0,0,0,.35), 0 18px 30px rgba(0,0,0,.25);
    --shadow-card-lg: 0 6px 14px rgba(0,0,0,.40), 0 28px 44px rgba(0,0,0,.28);
    --shadow-soft: 0 2px 6px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1712;
  --surface: #15221A;
  --node: #1B2B21;
  --node-hover: #213428;
  --ink: #ECF6EF;
  --muted: #A9B7AE;
  --soft: #7F8D84;
  --line: rgba(255, 255, 255, 0.10);
  --wire: #6E7C73;
  --green-text: #4BD27A;
  --sf: #7FD0F6;
  --mule: #4BD27A;
  --claude: #ECF6EF;
  --cache: #4BD27A;
  --shadow-card: 0 4px 10px rgba(0,0,0,.35), 0 18px 30px rgba(0,0,0,.25);
  --shadow-card-lg: 0 6px 14px rgba(0,0,0,.40), 0 28px 44px rgba(0,0,0,.28);
  --shadow-soft: 0 2px 6px rgba(0,0,0,.35);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Rubik", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
.eyebrow {
  margin: 0;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

/* Hero */
.hero-wrap { max-width: 1480px; margin: 0 auto; padding: 20px 24px 28px; }
.hero {
  position: relative;
  overflow: hidden;
  border-radius: 36px;
  background: var(--grad);
  color: var(--hero-ink);
  padding: 34px 40px 36px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 24px 40px;
  align-items: center;
}
.hero::before, .hero::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  background: rgba(244, 255, 247, 0.5);
  pointer-events: none;
}
.hero::before { width: 360px; height: 360px; left: -150px; top: -190px; }
.hero::after { width: 420px; height: 420px; right: -140px; bottom: -260px; }
.hero > * { position: relative; z-index: 1; }
.hero .eyebrow { color: rgba(17, 17, 17, 0.72); margin-bottom: 10px; }
.hero h1 {
  margin: 0 0 10px;
  font-size: clamp(28px, 3.6vw, 48px);
  line-height: 1.05;
  font-weight: 700;
  letter-spacing: -0.02em;
}
.lede { margin: 0; max-width: 64ch; font-size: 16px; color: rgba(17, 17, 17, 0.82); }
.hero-side { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; align-self: stretch; justify-content: space-between; }
.logo { width: 150px; height: auto; display: block; }
.hero-art { width: 170px; height: auto; display: block; filter: drop-shadow(0 18px 24px rgba(0, 60, 30, 0.18)); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 22px; }
.seg {
  display: inline-flex;
  border-radius: 999px;
  padding: 4px;
  background: #FFFFFF;
  box-shadow: 0 2px 6px rgba(0,0,0,.10);
}
.seg button {
  border: 0;
  background: transparent;
  padding: 9px 18px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  color: #58595B;
}
.seg button[aria-checked="true"] { background: #17B14A; color: #FFFFFF; }
.walk {
  border: 0;
  background: #111111;
  color: #FFFFFF;
  border-radius: 999px;
  padding: 12px 20px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(0,0,0,.18);
  transition: transform .15s;
}
.walk:active { transform: scale(0.98); }
.walk[aria-pressed="true"] { background: #FFFFFF; color: #111111; }

/* Layout */
.layout {
  max-width: 1480px;
  margin: 0 auto;
  padding: 0 24px 48px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 28px;
}
.stage { overflow-x: auto; padding: 4px 0 40px; }
.diagram {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(230px, 1fr));
  column-gap: 104px;
  padding: 6px 56px 6px 40px;
  min-width: 980px;
}
#wires { position: absolute; left: 0; top: 0; z-index: 2; pointer-events: none; overflow: visible; }

.zone {
  background: var(--surface);
  border-radius: 32px;
  padding: 18px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 22px;
  box-shadow: var(--shadow-card);
  outline: 2px solid transparent;
  outline-offset: 3px;
  transition: outline-color .2s;
}
.zone.sf { --z: var(--sf); --zb: var(--sf-badge); --zbi: var(--sf-badge-ink); --zbar: var(--sky); }
.zone.mule { --z: var(--mule); --zb: var(--mule-badge); --zbi: var(--mule-badge-ink); --zbar: var(--green); }
.zone.claude { --z: var(--claude); --zb: var(--grad-diag); --zbi: #111111; --zbar: var(--grad-diag); }
.zone.is-selected { outline-color: var(--green); }

.zone-head {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: 52px 1fr;
  align-items: center;
  column-gap: 12px;
  background: none;
  border: 0;
  padding: 0 2px 14px;
  text-align: left;
  cursor: pointer;
}
.zone-head::after {
  content: "";
  position: absolute;
  left: 2px;
  bottom: 0;
  width: 44px;
  height: 4px;
  border-radius: 999px;
  background: var(--zbar);
}
.zicon { width: 52px; height: 52px; object-fit: contain; grid-row: span 2; }
.zname { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink); line-height: 1.15; }
.zone-head:hover .zname { text-decoration: underline; text-decoration-color: var(--zbar); text-decoration-thickness: 2px; text-underline-offset: 4px; }
.zsub { font-size: 13px; color: var(--muted); line-height: 1.3; }
.spacer { flex: 1 1 auto; min-height: 0; margin-top: -22px; }

.node {
  position: relative;
  z-index: 3;
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 10px;
  row-gap: 2px;
  width: 100%;
  text-align: left;
  background: var(--node);
  border: 0;
  border-radius: 16px;
  padding: 12px 14px;
  cursor: pointer;
  scroll-margin-top: 16px;
  transition: background-color .15s, box-shadow .15s, transform .15s;
}
.node:hover { background: var(--node-hover); box-shadow: var(--shadow-soft); }
.node:active { transform: scale(0.98); }
.node.is-selected {
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--green), var(--shadow-card);
}
.node .step {
  grid-row: span 2;
  align-self: start;
  margin-top: 1px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--zb);
  color: var(--zbi);
  font-size: 12px;
  font-weight: 700;
}
.node .label { font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.node .sub { font-size: 12.5px; color: var(--muted); line-height: 1.35; }
.node.no-step { grid-template-columns: 1fr; }

.node.cache { background: var(--grad-diag); color: #111111; }
.node.cache .sub { color: rgba(17, 17, 17, 0.75); }
.node.cache .step { background: #FFFFFF; color: #111111; }
.node.cache:hover { background: var(--grad-diag); box-shadow: var(--shadow-card); }
.node.cache.is-selected { box-shadow: 0 0 0 2px var(--ink), var(--shadow-card); }
.node.cache .label { font-size: 15px; }

.inner {
  border: 1.5px dashed color-mix(in srgb, var(--green) 45%, transparent);
  border-radius: 20px;
  padding: 10px 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 22px;
}
.inner-toggle {
  position: relative;
  z-index: 3;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  background: none;
  border: 0;
  padding: 2px 4px;
  cursor: pointer;
  font-weight: 600;
  font-size: 13.5px;
  color: var(--green-text);
  margin-bottom: -10px;
}
.inner-toggle .hint {
  font-weight: 600;
  font-size: 12px;
  color: var(--green-text);
  background: color-mix(in srgb, var(--green) 12%, transparent);
  padding: 3px 10px;
  border-radius: 999px;
}
.inner-body { display: flex; flex-direction: column; gap: 22px; }
.support { display: flex; flex-direction: column; gap: 8px; margin-top: -8px; }
.support-title { font-size: 12.5px; color: var(--muted); margin: 0 4px; }
.node.support-node { background: transparent; box-shadow: inset 0 0 0 1px var(--line); padding: 9px 14px; }
.node.support-node:hover { background: var(--node); }
.node.support-node.is-selected { background: var(--surface); box-shadow: 0 0 0 2px var(--green), var(--shadow-card); }
.inner[data-open="false"] .inner-body { display: none; }
.inner[data-open="true"] .summary { display: none; }
.node.summary { box-shadow: inset 0 0 0 1px var(--line); }

.handoff {
  display: none;
  align-self: flex-start;
  font-size: 12.5px;
  color: var(--muted);
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: var(--shadow-soft);
  margin: -10px 0;
}

/* Wires */
.wire { fill: none; stroke: var(--wire); stroke-width: 1.75; transition: opacity .2s; }
.wire.regen { stroke-dasharray: 1.5 5; stroke-linecap: round; stroke-width: 2; }
.wire.cache { stroke: var(--cache); stroke-dasharray: 5 5; stroke-width: 1.75; }
.wire.dim, .wlabel.dim { opacity: .2; }
.wire.active { stroke: var(--ink); stroke-width: 2.25; }
.wire.cache.active { stroke: var(--cache); stroke-width: 2.5; animation: flow 0.9s linear 3; }
@keyframes flow { to { stroke-dashoffset: -20; } }
.wlabel {
  font-family: inherit;
  font-size: 11.5px;
  font-weight: 500;
  fill: var(--muted);
  paint-order: stroke;
  stroke: var(--paper);
  stroke-width: 5px;
  stroke-linejoin: round;
}

/* Legend */
.legend {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 4px;
  font-size: 13px;
  color: var(--muted);
  align-items: center;
}
.legend > span {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: var(--surface);
  padding: 6px 14px 6px 10px;
  border-radius: 999px;
  box-shadow: var(--shadow-soft);
}
.legend svg { flex: none; }
.footnote { margin: 12px 0 0; font-size: 12.5px; color: var(--soft); max-width: 80ch; }

/* Panel */
.panel {
  background: var(--surface);
  border-radius: 24px;
  padding: 24px 24px 26px;
  box-shadow: var(--shadow-card);
}
.panel-close {
  float: right;
  border: 0;
  background: var(--node);
  border-radius: 999px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  margin: -6px -6px 8px 12px;
}
.p-zone {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--z);
}
.p-zone .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--zdot, var(--z)); }
.p-step { color: var(--soft); font-weight: 500; }
.panel h2 { margin: 8px 0 12px; font-size: 24px; line-height: 1.15; font-weight: 700; letter-spacing: -0.015em; }
.panel p { margin: 0 0 10px; }
.panel h3 { margin: 18px 0 8px; font-size: 14px; font-weight: 700; }
.panel ul { margin: 0; padding: 0; list-style: none; }
.panel li { position: relative; margin: 0 0 6px; padding-left: 18px; font-size: 14px; }
.panel li::before {
  content: "";
  position: absolute;
  left: 2px;
  top: 0.55em;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}
.panel .ghost {
  margin-top: 18px;
  border: 0;
  background: var(--green);
  color: #FFFFFF;
  border-radius: 999px;
  padding: 10px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 6px 16px rgba(23, 177, 74, .28);
}
.walkbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 22px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  flex-wrap: wrap;
}
.walkbar .btns { display: flex; gap: 8px; }
.walkbar button {
  border: 0;
  background: var(--surface);
  box-shadow: inset 0 0 0 2px var(--green);
  color: var(--green-text);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 13.5px;
  font-weight: 600;
  cursor: pointer;
}
.walkbar button.primary { background: var(--green); color: #FFFFFF; box-shadow: 0 6px 16px rgba(23, 177, 74, .28); }
.walkbar button:disabled { opacity: .35; cursor: default; }
.walkbar .exit { box-shadow: none; background: var(--node); color: var(--muted); }

/* Entrance */
@media (prefers-reduced-motion: no-preference) {
  .zone, .hero { animation: rise .6s cubic-bezier(.2, .7, .3, 1) both; }
  .zone.sf { animation-delay: .08s; }
  .zone.mule { animation-delay: .16s; }
  .zone.claude { animation-delay: .24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: none; } }
}

@media (min-width: 1320px) {
  .layout { grid-template-columns: minmax(0, 1fr) 370px; align-items: start; }
  .panel {
    position: sticky;
    top: calc(16px + env(safe-area-inset-top, 0px));
    max-height: calc(100vh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    overflow: auto;
  }
  .panel-close { display: none; }
}
@media (max-width: 1319px) {
  .panel {
    position: fixed;
    z-index: 30;
    right: 16px;
    top: calc(16px + env(safe-area-inset-top, 0px));
    bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    width: min(390px, calc(100% - 32px));
    overflow: auto;
    transform: translateX(calc(100% + 40px));
    transition: transform .3s cubic-bezier(.2, .7, .3, 1);
    box-shadow: var(--shadow-card-lg);
  }
  .panel.open { transform: none; }
}
@media (max-width: 899px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding: 26px 24px 28px; border-radius: 28px; }
  .hero-side { flex-direction: row; align-items: center; justify-content: space-between; order: -1; }
  .hero-art { display: none; }
  .logo { width: 120px; }
}
@media (max-width: 819px) {
  .hero-wrap { padding: 12px 16px 20px; }
  .layout { padding: 0 16px 32px; }
  .diagram { grid-template-columns: minmax(0, 1fr); row-gap: 24px; min-width: 0; padding: 2px 30px 2px 20px; }
  .spacer { display: none; }
  .handoff { display: inline-block; }
  .panel {
    left: 0;
    right: 0;
    top: auto;
    bottom: 0;
    width: auto;
    max-height: 64vh;
    border-radius: 24px 24px 0 0;
    padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateY(105%);
  }
  .panel.open { transform: none; }
}
@media (prefers-reduced-motion: reduce) {
  .wire.cache.active { animation: none; }
  .panel, .node, .wire, .zone { transition: none; }
}

/* Additions for flows */
.node.off { opacity: .38; }
.node.off:hover { opacity: .7; }
.node .step.multi { width: auto; min-width: 24px; padding: 0 7px; border-radius: 999px; font-size: 11px; }
.panel .note-off {
  margin: 0 0 12px;
  font-size: 13px;
  color: var(--muted);
  background: var(--node);
  border-radius: 12px;
  padding: 8px 12px;
}
.ptable-wrap { overflow-x: auto; margin: 4px 0 6px; }
.ptable { border-collapse: collapse; width: 100%; font-size: 13px; }
.ptable th, .ptable td { text-align: left; vertical-align: top; padding: 7px 8px; border-bottom: 1px solid var(--line); }
.ptable th { font-weight: 600; color: var(--muted); font-size: 12px; }
.ptable td:first-child { font-weight: 600; white-space: nowrap; }
.panel pre {
  margin: 6px 0 4px;
  padding: 12px 14px;
  background: var(--node);
  border-radius: 12px;
  font-size: 12px;
  line-height: 1.5;
  overflow-x: auto;
  white-space: pre;
}
.seg.flow button[aria-checked="true"] { background: #111111; color: #FFFFFF; }
</style>
</head>
<body>
<div class="hero-wrap">
<header class="hero">
  <div class="hero-main">
    <p class="eyebrow">KRH · Proposal automation</p>
    <h1>From one click to a proposal pack</h1>
    <p class="lede" id="lede"></p>
    <div class="controls">
      <div class="seg flow" role="radiogroup" aria-label="Which flow to show">
        <button type="button" role="radio" data-flow="gen" aria-checked="true">Generate pack</button>
        <button type="button" role="radio" data-flow="edit" aria-checked="false">Edit a section</button>
      </div>
      <div class="seg view" role="radiogroup" aria-label="Explanation style">
        <button type="button" role="radio" data-view="tech" aria-checked="true">Technical</button>
        <button type="button" role="radio" data-view="biz" aria-checked="false">Business</button>
      </div>
      <button type="button" class="walk" id="walkBtn" aria-pressed="false">Walk through the flow</button>
    </div>

      biz: "The bid manager asks for a change in plain words. Claude rewrites the section and finds anything else affected, the bid manager approves the changes, and the Word documents update automatically. Select any block for details."
    }
  }
};

const INNER = ["m2", "m3", "m4", "m5"];
const SUPPORT = ["m4", "m5"];
const ZONE_NAMES = { sf: "Salesforce", mule: "MuleSoft", claude: "Claude API" };

const TEXT = {
  tech: {
    support: "Supporting services",
    lg: ["Data flow", "Reads cached context", "Not used in this flow"],
    foot: "Cost figures are estimates at Claude Opus 5.5 list prices as of 13 Oct 2026. Edits made in Word after download are not tracked back into Salesforce.",
    emptyTitle: "Select a block",
    empty: ["Each block is one part of the flow. Selecting it explains what happens there, what it uses and why it’s built that way.",
            "Switch between Generate pack and Edit a section to see both flows. Select a lane title for an overview of that layer."]
  },
  biz: {
    support: "Working in the background",
    lg: ["How work moves", "Reuses the reference material", "Not used in this flow"],
    foot: "Costs are estimates based on list prices as of 13 Oct 2026. Changes made in Word after download stay in Word.",
    emptyTitle: "Select a block",
    empty: ["Each block is one step in producing or editing a proposal. Selecting it explains what happens in plain language and why it matters.",
            "Switch between Generate pack and Edit a section, or walk through either flow step by step."]
  }
};

/* ---------- State ---------- */
const state = { view: "tech", flow: "gen", selected: null, variant: null, walk: -1, innerOpen: true };
try {
  const v = localStorage.getItem("krh-flow-view"); if (v === "tech" || v === "biz") state.view = v;
  const f = localStorage.getItem("krh-flow-flow"); if (f === "gen" || f === "edit") state.flow = f;
} catch (e) {}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const mqWide = window.matchMedia("(min-width: 1320px)");
const mqNarrow = window.matchMedia("(max-width: 819px)");
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

const walkList = () => FLOWS[state.flow].walk.map(w => Array.isArray(w) ? { id: w[0], variant: w[1] } : { id: w, variant: null });
function resolve(id) { return (!state.innerOpen && INNER.includes(id)) ? "mInner" : id; }
function inFlow(id) {
  if (id.startsWith("z-") || SUPPORT.includes(id)) return true;
  if (id === "mInner") return true;
  const f = FLOWS[state.flow];
  return walkList().some(w => w.id === id) || f.edges.some(e => e[0] === id || e[1] === id);
}
function content(id, variant) {
  const n = NODES[id], v = state.view;
  const base = n[v] || {};
  let over = {};
  if (state.flow === "edit") {
    if (variant && n[variant]) over = n[variant][v] || {};
    else if (n.edit) over = n.edit[v] || {};
    else if (n.ask) over = n.ask[v] || {};
  }
  return Object.assign({}, base, over);
}
function stepNumbers(id) {
  const out = [];
  walkList().forEach((w, i) => { if (w.id === id) out.push(i + 1); });
  return out;
}

/* ---------- Render ---------- */
function renderLabels() {
  const v = state.view, T = TEXT[v];
  $("#lede").textContent = FLOWS[state.flow].lede[v];
  $("#supportTitle").textContent = T.support;
  $("#lg1").textContent = T.lg[0]; $("#lg2").textContent = T.lg[1]; $("#lg3").textContent = T.lg[2];
  $("#footnote").textContent = T.foot;
  $$(".zsub").forEach(el => { el.textContent = NODES[el.dataset.zsub][v].sub; });
  $$(".node").forEach(el => {
    const id = el.dataset.id;
    const c = content(id);
    const nums = stepNumbers(id);
    const step = nums.length ? `<span class="step${nums.length > 1 ? " multi" : ""}" aria-hidden="true">${nums.join(", ")}</span>` : "";
    el.classList.toggle("no-step", !nums.length);
    el.classList.toggle("off", !inFlow(id));
    el.innerHTML = `${step}<span class="label">${c.label || ""}</span><span class="sub">${c.sub || ""}</span>`;
    el.setAttribute("aria-label", (nums.length ? `Step ${nums.join(" and ")}: ` : "") + (c.label || ""));
  });
  $$(".seg.view button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.view === v)));
  $$(".seg.flow button").forEach(b => b.setAttribute("aria-checked", String(b.dataset.flow === state.flow)));
}

function renderSelection() {
  $$(".node").forEach(el => {
    const on = state.selected && resolve(state.selected) === el.dataset.id;
    el.classList.toggle("is-selected", !!on);
    el.setAttribute("aria-pressed", String(!!on));
  });
  $$(".zone").forEach(z => z.classList.toggle("is-selected", state.selected === "z-" + z.dataset.zone));
  const wb = $("#walkBtn");
  wb.setAttribute("aria-pressed", String(state.walk >= 0));
  wb.textContent = state.walk >= 0 ? "Exit walkthrough" : "Walk through the flow";
}

function renderPanel() {
  const box = $("#panelContent");
  const id = state.selected, v = state.view;
  if (!id) {
    const T = TEXT[v];
    box.innerHTML = `<h2>${T.emptyTitle}</h2>${T.empty.map(p => `<p>${p}</p>`).join("")}
      <button type="button" class="ghost" data-act="walk-start">Walk through the flow</button>`;
    return;
  }
  const n = NODES[id], c = content(id, state.variant);
  const list = walkList();
  let stepLabel = "";
  if (state.walk >= 0) stepLabel = `Step ${state.walk + 1} of ${list.length}`;
  else {
    const nums = stepNumbers(id);
    if (nums.length) stepLabel = `Step ${nums.join(" and ")} of ${list.length}`;
  }
  const dots = { sf: "var(--sky)", mule: "var(--green)", claude: "var(--grad-diag)" };
  let html = `<div class="p-zone" style="--z: var(--${n.cache ? "green-text" : n.zone}); --zdot: ${n.cache ? "var(--grad-diag)" : dots[n.zone]}"><span class="dot"></span>${ZONE_NAMES[n.zone]}${stepLabel ? `<span class="p-step">${stepLabel}</span>` : ""}</div>`;
  html += `<h2>${c.title}</h2>`;
  if (!inFlow(id)) html += `<p class="note-off">${state.flow === "edit" ? "Used when generating a new pack, not when editing." : "Used when editing a section, not when generating a new pack."}</p>`;
  html += (c.body || []).map(p => `<p>${p}</p>`).join("");
  if (c.code) html += `<pre>${c.code.replace(/</g, "&lt;")}</pre>`;
  if (c.table) {
    html += `<div class="ptable-wrap"><table class="ptable"><thead><tr>${c.table.head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${c.table.rows.map(r => `<tr>${r.map(x => `<td>${x}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }
  if (c.facts && c.facts.length) html += `<h3>${v === "tech" ? "Key details" : "Why it matters"}</h3><ul>${c.facts.map(f => `<li>${f}</li>`).join("")}</ul>`;
  if (state.walk >= 0) {
    html += `<div class="walkbar">
      <button type="button" class="exit" data-act="walk-exit">Exit</button>
      <div class="btns">
        <button type="button" data-act="walk-prev" ${state.walk === 0 ? "disabled" : ""}>Previous</button>
        <button type="button" class="primary" data-act="walk-next">${state.walk === list.length - 1 ? "Finish" : "Next"}</button>
      </div></div>`;
  } else if (stepNumbers(id).length) {
    html += `<button type="button" class="ghost" data-act="walk-from">Walk through from here</button>`;
  }
  box.innerHTML = html;
}

function bez(p, t) {
  const u = 1 - t;
  return [0, 1].map(k => u*u*u*p[0][k] + 3*u*u*t*p[1][k] + 3*u*t*t*p[2][k] + t*t*t*p[3][k]);
}

function drawWires() {
  const svg = $("#wires"), dia = $("#diagram");
  const W = dia.scrollWidth, H = dia.scrollHeight;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const narrow = mqNarrow.matches;
  const dr = dia.getBoundingClientRect();
  const box = id => {
    const el = document.querySelector(`.node[data-id="${id}"]`);
    if (!el || el.offsetParent === null) return null;
    const r = el.getBoundingClientRect();
    const x = r.left - dr.left, y = r.top - dr.top;
    return { x, y, w: r.width, h: r.height, r: x + r.width, b: y + r.height, cx: x + r.width / 2, cy: y + r.height / 2 };
  };
  const sel = state.selected && !state.selected.startsWith("z-") ? resolve(state.selected) : null;
  let paths = "", labels = "";
  for (const [from, to, o = {}] of FLOWS[state.flow].edges) {
    const a = resolve(from), b = resolve(to);
    if (a === b) continue;
    if (narrow && o.cross) continue;
    const A = box(a), B = box(b);
    if (!A || !B) continue;
    let d, mid = null;
    if (o.kind === "cache") {
      const off = narrow ? 12 + (o.i || 0) * 6 : 20 + (o.i || 0) * 12;
      const x0 = A.r, y0 = A.cy, x1 = B.r + 3, y1 = B.cy;
      d = `M${x0},${y0} C${x0 + off},${y0} ${x1 + off},${y1} ${x1},${y1}`;
    } else if (o.side === "left") {
      const off = narrow ? 16 : 30;
      const x0 = A.x, y0 = A.cy, x1 = B.x - 3, y1 = B.cy;
      d = `M${x0},${y0} C${x0 - off},${y0} ${x1 - off},${y1} ${x1},${y1}`;
    } else if (o.cross) {
      let x0, x1;
      if (B.x >= A.r - 4) { x0 = A.r; x1 = B.x - 3; } else { x0 = A.x; x1 = B.r + 3; }
      const y0 = A.y + A.h * (o.fa ?? 0.5), y1 = B.y + B.h * (o.fb ?? 0.5);
      const dx = (x1 - x0) / 2;
      const p = [[x0, y0], [x0 + dx, y0], [x1 - dx, y1], [x1, y1]];
      d = `M${p[0]} C${p[1]} ${p[2]} ${p[3]}`;
      mid = bez(p, 0.5);
    } else {
      const x0 = A.cx, y0 = A.b, x1 = B.cx, y1 = B.y - 3;
      if (Math.abs(x0 - x1) < 2) d = `M${x0},${y0} L${x1},${y1}`;
      else { const my = (y0 + y1) / 2; d = `M${x0},${y0} C${x0},${my} ${x1},${my} ${x1},${y1}`; }
    }
    const touches = sel && (a === sel || b === sel);
    const kind = o.kind || "flow";
    const cls = ["wire", kind];
    if (sel) cls.push(touches ? "active" : "dim");
    const marker = kind === "cache" ? "a-cache" : (touches ? "a-active" : "a-flow");
    paths += `<path class="${cls.join(" ")}" d="${d}" marker-end="url(#${marker})"/>`;
    if (o.label && mid) {
      labels += `<text class="wlabel${sel && !touches ? " dim" : ""}" x="${mid[0].toFixed(1)}" y="${(mid[1] - 8).toFixed(1)}" text-anchor="middle">${o.label[state.view]}</text>`;
    }
  }
  const defs = `<defs>
    <marker id="a-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--wire)"/></marker>
    <marker id="a-active" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--ink)"/></marker>
    <marker id="a-cache" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,5 L0,10 z" style="fill: var(--cache)"/></marker>
  </defs>`;
  svg.innerHTML = defs + paths + labels;
}

function setInner(open) {
  state.innerOpen = open;
  $("#inner").dataset.open = String(open);
  $("#innerToggle").setAttribute("aria-expanded", String(open));
  $("#innerHint").textContent = open ? "Hide" : "Show";
}
function openPanel() { if (!mqWide.matches) $("#panel").classList.add("open"); }

function select(id, opts = {}) {
  if (INNER.includes(id) && !state.innerOpen) setInner(true);
  state.selected = id;
  state.variant = opts.variant || null;
  renderSelection(); renderPanel(); drawWires(); openPanel();
  if (opts.scroll) {
    const el = id.startsWith("z-") ? document.querySelector(`[data-zone-id="${id}"]`) : document.querySelector(`.node[data-id="${id}"]`);
    if (el) el.scrollIntoView({ block: mqNarrow.matches ? "start" : "nearest", inline: "nearest", behavior: reduceMotion.matches ? "auto" : "smooth" });
  }
  if (!mqWide.matches) $("#panel").scrollTop = 0;
}
function clearSelection() {
  state.selected = null; state.variant = null; state.walk = -1;
  $("#panel").classList.remove("open");
  renderSelection(); renderPanel(); drawWires();
}
function walkTo(i) {
  const list = walkList();
  if (i < 0) return;
  if (i >= list.length) { exitWalk(); return; }
  state.walk = i;
  select(list[i].id, { scroll: true, variant: list[i].variant });
}
function exitWalk() { state.walk = -1; renderSelection(); renderPanel(); }

function setFlow(f) {
  if (f === state.flow) return;
  state.flow = f;
  try { localStorage.setItem("krh-flow-flow", f); } catch (e) {}
  state.walk = -1;
  renderLabels(); renderSelection(); renderPanel();
  requestAnimationFrame(drawWires);
}

/* ---------- Events ---------- */
$("#diagram").addEventListener("click", e => {
  const node = e.target.closest(".node");
  if (node) {
    const id = node.dataset.id;
    if (id === "mInner") { setInner(true); select("m3"); return; }
    let variant = null;
    if (state.walk >= 0) {
      const list = walkList();
      const wi = list.findIndex(w => w.id === id);
      state.walk = wi;
      if (wi >= 0) variant = list[wi].variant;
    }
    select(id, { variant });
    return;
  }
  const head = e.target.closest(".zone-head");
  if (head) { state.walk = -1; select(head.dataset.zoneId); return; }
  if (e.target.closest("#innerToggle")) {
    const willOpen = !state.innerOpen;
    setInner(willOpen);
    if (!willOpen && INNER.includes(state.selected)) { state.selected = "z-mule"; renderPanel(); }
    renderSelection(); drawWires();
  }
});

$(".seg.view").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b || b.dataset.view === state.view) return;
  state.view = b.dataset.view;
  try { localStorage.setItem("krh-flow-view", state.view); } catch (err) {}
  renderLabels(); renderSelection(); renderPanel();
  requestAnimationFrame(drawWires);
});
$(".seg.flow").addEventListener("click", e => {
  const b = e.target.closest("button[data-flow]");
  if (b) setFlow(b.dataset.flow);
});
$("#walkBtn").addEventListener("click", () => { state.walk >= 0 ? exitWalk() : walkTo(0); });
$("#panel").addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const a = act.dataset.act;
  if (a === "walk-start") walkTo(0);
  else if (a === "walk-from") {
    const list = walkList();
    const i = list.findIndex(w => w.id === state.selected && (!state.variant || w.variant === state.variant));
    walkTo(i >= 0 ? i : 0);
  }
  else if (a === "walk-next") walkTo(state.walk + 1);
  else if (a === "walk-prev") walkTo(state.walk - 1);
  else if (a === "walk-exit") exitWalk();
});
$("#panelClose").addEventListener("click", clearSelection);
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (state.walk >= 0) exitWalk(); else if (state.selected) clearSelection(); }
  if (state.walk >= 0) {
    if (e.key === "ArrowRight") { e.preventDefault(); walkTo(state.walk + 1); }
    if (e.key === "ArrowLeft") { e.preventDefault(); walkTo(state.walk - 1); }
  }
});

const ro = new ResizeObserver(() => drawWires());
ro.observe($("#diagram"));
window.addEventListener("resize", drawWires);
mqWide.addEventListener("change", () => { if (mqWide.matches) $("#panel").classList.remove("open"); else if (state.selected) openPanel(); });

renderLabels(); renderSelection(); renderPanel(); drawWires();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawWires);
$$(".zone, .hero").forEach(el => el.addEventListener("animationend", drawWires));
</script>

</body>
</html>
